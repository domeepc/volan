name: CI Build for Raspberry Pi

on:
  push:
    branches:
      - display_development
      - main

permissions:
  contents: read

jobs:
  build-rpi:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with deps (cached)
        uses: docker/build-push-action@v5
        with:
          context: .github
          file: .github/Dockerfile.rpi
          platforms: linux/arm64
          load: true
          tags: volan-builder:latest
          cache-from: type=gha,scope=rpi-${{ hashFiles('.github/Dockerfile.rpi') }}
          cache-to: type=gha,scope=rpi-${{ hashFiles('.github/Dockerfile.rpi') }},mode=max

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-ccache-arm64-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'src/**/*.qml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-arm64-

      - name: Build application
        run: |
          mkdir -p .cache/ccache

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.cache/ccache:/root/.cache/ccache \
            -w /workspace \
            volan-builder:latest \
            bash -c "
              set -e
              export CCACHE_DIR=/root/.cache/ccache
              export PATH=/usr/lib/ccache:\$PATH
              ccache --max-size=500M

              echo 'Building...'
              mkdir -p build-rpi && cd build-rpi
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DCMAKE_CXX_STANDARD=17 \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              make -j\$(nproc)
              strip appvolan

              echo 'ccache stats:' && ccache --show-stats
              echo 'Build complete!' && file appvolan
            "

      - name: Verify build
        run: |
          ls -lh build-rpi/appvolan
          file build-rpi/appvolan
