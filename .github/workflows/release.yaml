name: Build and Release for Raspberry Pi

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  build-rpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: apt-cache
          key: ${{ runner.os }}-apt-arm64-${{ hashFiles('.github/workflows/release.yaml') }}
          restore-keys: |
            ${{ runner.os }}-apt-arm64-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build-rpi
            .cache/ccache
          key: ${{ runner.os }}-cmake-arm64-${{ hashFiles('CMakeLists.txt', '*.cpp', '*.h', '*.qml') }}
          restore-keys: |
            ${{ runner.os }}-cmake-arm64-

      - name: Build for Raspberry Pi using ARM64 container
        run: |
          # Create cache directories
          mkdir -p apt-cache .cache/ccache

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/apt-cache:/var/cache/apt/archives \
            -v ${{ github.workspace }}/.cache/ccache:/root/.cache/ccache \
            -w /workspace \
            arm64v8/debian:bookworm \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              export CCACHE_DIR=/root/.cache/ccache
              
              echo 'Installing dependencies...'
              apt-get update
              apt-get install -y \
                build-essential \
                cmake \
                ccache \
                qt6-base-dev \
                qt6-declarative-dev \
                qt6-serialbus-dev \
                libqt6serialbus6-dev \
                libgl1-mesa-dev \
                file
              
              # Configure ccache
              export PATH=/usr/lib/ccache:\$PATH
              ccache --max-size=500M
              ccache --show-stats
              
              echo 'Creating build directory...'
              mkdir -p build-rpi
              cd build-rpi
              
              echo 'Configuring with CMake...'
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DCMAKE_CXX_STANDARD=17 \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              
              echo 'Building application...'
              make -j\$(nproc)
              
              echo 'CCache statistics:'
              ccache --show-stats
              
              echo 'Build complete!'
              ls -lh appvolan
              file appvolan
              strip appvolan
            "

      - name: Verify build
        run: |
          ls -lh build-rpi/appvolan
          file build-rpi/appvolan

      - name: Package release
        run: |
          mkdir -p release
          cp build-rpi/appvolan release/
          cp README.md release/ 2>/dev/null || true
          cp LICENSE release/ 2>/dev/null || true

          # Create a simple installation script
          cat > release/install.sh << 'EOF'
          #!/bin/bash
          # Volan installation script for Raspberry Pi

          echo "==================================="
          echo "Volan Installation Script"
          echo "==================================="
          echo ""

          # Check for required Qt6 libraries
          echo "Checking for required Qt6 libraries..."
          if ! dpkg -l | grep -q libqt6serialbus6; then
            echo "Qt6 libraries not found. Installing dependencies..."
            sudo apt-get update
            sudo apt-get install -y \
              libqt6core6 \
              libqt6gui6 \
              libqt6qml6 \
              libqt6quick6 \
              libqt6serialbus6 \
              libqt6opengl6 \
              qt6-qpa-plugins \
              qml6-module-qtquick \
              qml6-module-qtquick-controls \
              qml6-module-qtquick-layouts \
              qml6-module-qtquick-window \
              libgl1 \
              libegl1 \
              libgles2
            echo "Dependencies installed successfully!"
          else
            echo "Qt6 libraries already installed. Checking for platform plugins..."
            if ! dpkg -l | grep -q qt6-qpa-plugins; then
              echo "Installing Qt6 platform plugins..."
              sudo apt-get update
              sudo apt-get install -y qt6-qpa-plugins libgl1 libegl1 libgles2
            fi
          fi

          echo ""
          echo "Installing Volan application..."
          sudo cp appvolan /usr/local/bin/
          sudo chmod +x /usr/local/bin/appvolan
          echo "Installation complete!"
          echo ""
          echo "==================================="
          echo "Setup Instructions"
          echo "==================================="
          echo ""
          echo "1. Set up CAN interface:"
          echo "   sudo ip link set can0 up type can bitrate 1000000"
          echo ""
          echo "2. To make CAN setup persistent, add to /etc/network/interfaces:"
          echo "   auto can0"
          echo "   iface can0 inet manual"
          echo "     pre-up /sbin/ip link set can0 type can bitrate 1000000"
          echo "     up /sbin/ip link set can0 up"
          echo ""
          echo "3. Run the application:"
          echo "   appvolan"
          echo ""
          EOF
          chmod +x release/install.sh

          # Create archive
          cd release
          tar czf ../volan-rpi4-${GITHUB_REF_NAME}.tar.gz *
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            volan-rpi4-${{ github.ref_name }}.tar.gz
            build-rpi/appvolan
          body: |
            ## Volan Release ${{ github.ref_name }}

            Build for Raspberry Pi 4 Compute Module (ARM64/aarch64)

            ### Features
            - Qt-based GUI application
            - CAN network support via Qt SerialBus
            - Optimized for Raspberry Pi 4 Compute Module

            ### Installation

            1. Download and extract the archive:
               ```bash
               wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/volan-rpi4-${{ github.ref_name }}.tar.gz
               tar xzf volan-rpi4-${{ github.ref_name }}.tar.gz
               ```

            2. Run the installation script (this will install Qt6 dependencies):
               ```bash
               chmod +x install.sh
               ./install.sh
               ```

            **Manual installation** (if you prefer):
            ```bash
            # Install Qt6 dependencies and platform plugins
            sudo apt-get update
            sudo apt-get install -y \
              libqt6core6 libqt6gui6 libqt6qml6 libqt6quick6 \
              libqt6serialbus6 libqt6opengl6 qt6-qpa-plugins \
              qml6-module-qtquick qml6-module-qtquick-controls \
              libgl1 libegl1 libgles2

            # Copy binary
            sudo cp appvolan /usr/local/bin/
            sudo chmod +x /usr/local/bin/appvolan
            ```

            **Troubleshooting:**
            - If you get "no Qt platform plugin could be initialized", ensure `qt6-qpa-plugins` is installed
            - For headless/embedded display, set: `export QT_QPA_PLATFORM=eglfs`
            - For X11/desktop, Qt should auto-detect, or set: `export QT_QPA_PLATFORM=xcb`

            ### Requirements
            - Raspberry Pi 4 Compute Module (or Raspberry Pi 4 Model B)
            - Raspberry Pi OS (64-bit) - Bookworm or later
            - Qt 6 runtime libraries (installed automatically by script)
            - CAN interface hardware (e.g., MCP2515, Waveshare CAN HAT)

            ### Setup CAN Interface
            ```bash
            # Enable CAN interface
            sudo ip link set can0 up type can bitrate 500000

            # Verify interface is up
            ip link show can0
            ```

            ### Running
            ```bash
            appvolan
            ```

            Built on: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
