name: Release for Raspberry Pi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with deps (cached)
        uses: docker/build-push-action@v5
        with:
          context: .github
          file: .github/Dockerfile.rpi
          platforms: linux/arm64
          load: true
          tags: volan-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-ccache-arm64-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'src/**/*.qml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-arm64-

      - name: Build application
        run: |
          mkdir -p .cache/ccache

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.cache/ccache:/root/.cache/ccache \
            -w /workspace \
            volan-builder:latest \
            bash -c "
              set -e
              export CCACHE_DIR=/root/.cache/ccache
              export PATH=/usr/lib/ccache:\$PATH
              ccache --max-size=500M

              echo 'Building...'
              mkdir -p build-rpi && cd build-rpi
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DCMAKE_CXX_STANDARD=17 \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_INSTALL_RPATH='\$ORIGIN/lib' \
                -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
              make -j\$(nproc)
              strip appvolan

              echo 'ccache stats:' && ccache --show-stats
              echo 'Build complete!' && file appvolan

              echo 'Copying Qt runtime libraries for bundling...'
              mkdir -p /workspace/qt-libs/plugins /workspace/qt-libs/qml
              cp /usr/lib/aarch64-linux-gnu/libQt6Core.so.6*       /workspace/qt-libs/
              cp /usr/lib/aarch64-linux-gnu/libQt6Gui.so.6*        /workspace/qt-libs/
              cp /usr/lib/aarch64-linux-gnu/libQt6Network.so.6*    /workspace/qt-libs/
              cp /usr/lib/aarch64-linux-gnu/libQt6Qml.so.6*        /workspace/qt-libs/
              cp /usr/lib/aarch64-linux-gnu/libQt6Quick.so.6*      /workspace/qt-libs/
              cp /usr/lib/aarch64-linux-gnu/libQt6SerialBus.so.6*  /workspace/qt-libs/
              cp /usr/lib/aarch64-linux-gnu/libQt6SerialPort.so.6* /workspace/qt-libs/
              cp /usr/lib/aarch64-linux-gnu/libQt6OpenGL.so.6*     /workspace/qt-libs/
              cp /usr/lib/aarch64-linux-gnu/libQt6DBus.so.6*           /workspace/qt-libs/ 2>/dev/null || true
              cp /usr/lib/aarch64-linux-gnu/libQt6XcbQpa.so.6*         /workspace/qt-libs/ 2>/dev/null || true
              cp /usr/lib/aarch64-linux-gnu/libQt6EglFsKmsSupport.so.6* /workspace/qt-libs/ 2>/dev/null || true
              cp /usr/lib/aarch64-linux-gnu/libQt6WaylandClient.so.6*  /workspace/qt-libs/ 2>/dev/null || true
              cp -r /usr/lib/aarch64-linux-gnu/qt6/plugins/platforms      /workspace/qt-libs/plugins/ 2>/dev/null || true
              cp -r /usr/lib/aarch64-linux-gnu/qt6/plugins/xcbglintegrations /workspace/qt-libs/plugins/ 2>/dev/null || true
              cp -r /usr/lib/qt6/qml/QtQuick /workspace/qt-libs/qml/ 2>/dev/null || true
              cp -r /usr/lib/qt6/qml/QtQml   /workspace/qt-libs/qml/ 2>/dev/null || true
            "

      - name: Verify build
        run: |
          ls -lh build-rpi/appvolan
          file build-rpi/appvolan

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: volan-rpi4
          path: |
            build-rpi/appvolan
            qt-libs/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: volan-rpi4
          path: artifact

      - name: Package release
        run: |
          mkdir -p release/lib release/plugins release/qml
          cp artifact/build-rpi/appvolan release/
          cp README.md release/ 2>/dev/null || true
          cp LICENSE release/ 2>/dev/null || true

          # Bundle Qt runtime libraries
          cp artifact/qt-libs/*.so.6*          release/lib/ 2>/dev/null || true
          cp -r artifact/qt-libs/plugins/*     release/plugins/ 2>/dev/null || true
          cp -r artifact/qt-libs/qml/*         release/qml/ 2>/dev/null || true

          # Create installation script
          cat > release/install.sh << 'EOF'
          #!/bin/bash
          # Volan installation script for Raspberry Pi

          echo "==================================="
          echo "Volan Installation Script"
          echo "==================================="
          echo ""

          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"

          # Install system-level GL/EGL deps from OS repos
          echo "Installing system GL dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libgles2 libfontconfig1 libdbus-1-3 2>/dev/null || true

          # Install bundled Qt libraries (exact version binary was linked against)
          echo "Installing bundled Qt libraries..."
          sudo cp "$SCRIPT_DIR"/lib/libQt6*.so.6* /usr/local/lib/
          sudo ldconfig

          # Install Qt platform plugins
          echo "Installing Qt plugins..."
          sudo mkdir -p /usr/local/lib/qt6/plugins
          sudo cp -r "$SCRIPT_DIR"/plugins/* /usr/local/lib/qt6/plugins/ 2>/dev/null || true

          # Install QML modules
          echo "Installing QML modules..."
          sudo mkdir -p /usr/local/lib/qt6/qml
          sudo cp -r "$SCRIPT_DIR"/qml/* /usr/local/lib/qt6/qml/ 2>/dev/null || true

          # Install binary
          echo "Installing Volan application..."
          sudo cp "$SCRIPT_DIR"/appvolan /usr/local/bin/
          sudo chmod +x /usr/local/bin/appvolan

          # Create wrapper that sets Qt paths to the bundled libs
          sudo tee /usr/local/bin/volan > /dev/null << 'WRAPPER'
          #!/bin/bash
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          export QT_PLUGIN_PATH=/usr/local/lib/qt6/plugins
          export QML2_IMPORT_PATH=/usr/local/lib/qt6/qml
          exec /usr/local/bin/appvolan "$@"
          WRAPPER
          sudo chmod +x /usr/local/bin/volan

          echo ""
          echo "Installation complete!"
          echo ""
          echo "==================================="
          echo "Setup Instructions"
          echo "==================================="
          echo ""
          echo "1. Set up CAN interface:"
          echo "   sudo ip link set can0 up type can bitrate 1000000"
          echo ""
          echo "2. To make CAN setup persistent, add to /etc/network/interfaces:"
          echo "   auto can0"
          echo "   iface can0 inet manual"
          echo "     pre-up /sbin/ip link set can0 type can bitrate 1000000"
          echo "     up /sbin/ip link set can0 up"
          echo ""
          echo "3. Run the application:"
          echo "   volan"
          echo ""
          EOF
          chmod +x release/install.sh

          tar czf volan-rpi4-${{ github.ref_name }}.tar.gz -C release .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            volan-rpi4-${{ github.ref_name }}.tar.gz
            artifact/build-rpi/appvolan
          body: |
            ## Volan Release ${{ github.ref_name }}

            Build for Raspberry Pi 4 Compute Module (ARM64/aarch64)

            ### Features
            - Qt-based GUI application
            - CAN network support via Qt SerialBus
            - Optimized for Raspberry Pi 4 Compute Module

            ### Installation

            1. Download and extract the archive:
               ```bash
               wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/volan-rpi4-${{ github.ref_name }}.tar.gz
               tar xzf volan-rpi4-${{ github.ref_name }}.tar.gz
               ```

            2. Run the installation script:
               ```bash
               chmod +x install.sh
               ./install.sh
               ```

            **Troubleshooting:**
            - For headless/embedded display, set: `export QT_QPA_PLATFORM=eglfs`
            - For X11/desktop: `export QT_QPA_PLATFORM=xcb`

            ### Requirements
            - Raspberry Pi 4 Compute Module (or Raspberry Pi 4 Model B)
            - Raspberry Pi OS (64-bit) - Bookworm or later
            - CAN interface hardware (e.g., MCP2515, Waveshare CAN HAT)

            ### Setup CAN Interface
            ```bash
            sudo ip link set can0 up type can bitrate 500000
            ip link show can0
            ```

            ### Running
            ```bash
            volan
            ```

            Built on: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
